{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1 class="h3">Create an account</h1>
<form method="post" class="col-md-4">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div class="mb-2"><label class="form-label">Username</label><input class="form-control" name="username" value="{{ request.form.username }}" pattern="[A-Za-z0-9_]{3,30}" required></div>
  <div class="mb-2"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ request.form.email }}" required></div>
  <div class="mb-3"><label class="form-label">Password (8+ characters)</label><input class="form-control" type="password" name="password" minlength="8" required></div>
  <button class="btn btn-primary">Register</button>
</form>
{% endblock %}
